<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLAN Guide</title>
<style>
  :root { --bg:#fff; --ink:#1a1d23; --muted:#5b6370; --card:#f4f6f9; --line:#d9dee5; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --ink:#e8ebf0; --muted:#9aa3b0; --card:#1d222a; --line:#2f3640; --accent:#6ea0ff; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 64px; }
  a { color:var(--accent); }
  table { border-collapse:collapse; display:block; overflow-x:auto; }
  th,td { border:1px solid var(--line); padding:6px 10px; text-align:left; }
  th { background:var(--card); }
  code { background:var(--card); padding:1px 5px; border-radius:4px; }
  pre { background:var(--card); padding:12px; border-radius:8px; overflow-x:auto; }
  pre code { padding:0; background:none; }
  hr { border:0; border-top:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <p><a href="./">&larr; Back</a></p>
  <article id="out">Loading…</article>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  const doc = new URLSearchParams(location.search).get('doc') || '';
  const out = document.getElementById('out');
  if (!/^[\w-]+\.md$/.test(doc)) {
    out.textContent = 'Unknown document.';
  } else {
    fetch(doc).then(r => { if (!r.ok) throw 0; return r.text(); })
      .then(t => { out.innerHTML = marked.parse(t); document.title = (out.querySelector('h1') || {}).textContent || doc; })
      .catch(() => { out.textContent = 'Could not load ' + doc; });
  }
</script>
</body>
</html>
